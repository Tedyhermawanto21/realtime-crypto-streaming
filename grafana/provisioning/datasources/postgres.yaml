apiVersion: 1
datasources:
  - name: Crypto PostgreSQL
    uid: crypto-pg
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: crypto
    isDefault: true
    jsonData:
      database: crypto
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: crypto
